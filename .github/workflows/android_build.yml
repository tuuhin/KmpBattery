name: Build Android Project

on:
  release:
    types: [ created ]
  workflow_dispatch:

jobs:
  android-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'liberica'
          cache: 'gradle'
      - run: chmod +x ./gradlew
      - run: ./gradlew :sample:androidApp:assembleDebug