name: Build Android and Linux Project

on:
  release:
    types: [ created ]
  workflow_dispatch:

jobs:
  android-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'liberica'
          cache: 'gradle'
      - run: chmod +x ./gradlew
      - run: ./gradlew :sample:androidApp:assembleDebug

  linux-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Native Dependencies & Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            imagemagick \
            libglib2.0-dev \
            libmount-dev \
            libblkid-dev
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'liberica'
          cache: 'gradle'
      - run: chmod +x ./gradlew
      - run: ./gradlew :sample:desktopApp:assemble :sample:terminalApp:assemble :sample:desktopApp:packageDistributionForCurrentOS
