name: Build Project

on:
  release:
    types: [ created ]
  workflow_dispatch:

jobs:
  android-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'liberica'
          cache: 'gradle'
      - run: chmod +x ./gradlew
      - run: ./gradlew :sample:androidApp:assembleDebug

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'liberica'
          cache: 'gradle'
      - run: .\gradlew.bat :sample:desktopApp:assemble :sample:terminalApp:assemble :sample:desktopApp:packageDistributionForCurrentOS

  macos-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'liberica'
          cache: 'gradle'
      - run: chmod +x ./gradlew
      - run: |
          xcodebuild build \
            -project sample/iosAppCmp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO