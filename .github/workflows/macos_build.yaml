name: Build Macos and ios Project

on:
  release:
    types: [ created ]
  workflow_dispatch:

jobs:
  macos-ios-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'liberica'
          cache: 'gradle'
      - run: chmod +x ./gradlew
      - name: Run xcode build for ios project
        run: |
          export PATH="$JAVA_HOME/bin:$PATH"
          xcodebuild build \
            -project sample/iosAppCmp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO

  macos-desktop-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'liberica'
          cache: 'gradle'
      - run: chmod +x ./gradlew
      - name: Install ImageMagick and ensure its present
        run: brew install imagemagick
      - run: ./gradlew :sample:desktopApp:assemble :sample:terminalApp:assemble
